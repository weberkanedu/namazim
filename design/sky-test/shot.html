<!doctype html>
<meta charset="utf-8">
<title>sky shot</title>
<style>html,body{margin:0;background:#000}canvas{width:390px;height:300px;display:block}</style>
<canvas id="c" width="780" height="600"></canvas>
<script src="sky.js"></script>
<script>
  // One frame of the sky at a given minute of the day, for headless screenshots:
  //   shot.html?t=780   (minutes after midnight)
  var q = new URLSearchParams(location.search);
  var t = parseFloat(q.get('t') || '780');
  var draw = createSky(document.getElementById('c'));
  draw({ t: t, time: 5 });
</script>
