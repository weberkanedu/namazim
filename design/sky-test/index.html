<!doctype html>
<html><head><meta charset="utf-8"><title>sky test</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px sans-serif;display:grid;grid-template-columns:repeat(3,390px);gap:8px;padding:8px}canvas{width:390px;height:300px;display:block}</style>
</head><body>
<script src="sky.js"></script>
<script>
var cases = [
  ['06:55 şafak', 415, {birds: [0.55, 0.45, 1, 0]}],
  ['07:20 doğuş', 440, {}],
  ['10:00 sabah, ay', 600, {plane: [0.6, 0.72, 1, 0]}],
  ['13:00 öğle', 780, {}],
  ['17:40 gün batımı', 1060, {birds: [0.7, 0.5, 1, 0]}],
  ['18:20 alacakaranlık', 1100, {}],
  ['21:00 gece', 1260, {meteor: [0.2, 0.8, 1, 0.5]}],
  ['23:30 ay doğdu', 1410, {}],
  ['03:00 gece, ay', 180, {}]
];
var errs = [];
cases.forEach(function (c) {
  var d = document.createElement('div');
  var cv = document.createElement('canvas'); cv.width = 390; cv.height = 300;
  d.appendChild(cv); d.appendChild(document.createTextNode(c[0])); document.body.appendChild(d);
  try {
    var draw = createSky(cv);
    draw(Object.assign({ t: c[1], time: 5 }, c[2]));
  } catch (e) { errs.push(String(e)); }
});
window.SKY_ERRORS = errs;
</script>
</body></html>
