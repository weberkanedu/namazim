<style>
body{font-family:var(--font-body);background:var(--background);color:var(--on-surface);padding:40px 24px}
h1{font:600 34px var(--font-display);color:var(--primary-ink)} p{color:var(--on-surface-variant);font-size:14px;margin:8px 0 24px;max-width:640px;line-height:1.6}
h2{font:500 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin:28px 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-width:900px}
.it{background:var(--surface-container);border:var(--hairline);border-radius:var(--r-sm);padding:16px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.it .nm{font:11px var(--font-mono);color:var(--subtle)}
a{color:var(--primary-ink)}
</style>
</head>

<h1>İkonlar</h1>
<p>Dock'taki dört sekme ve Kıble <b>dolu siluet</b> (uygulamadaki <code>ic_nav_*.xml</code> ile aynı çizim; Zikir yeni). Geri kalanı Lucide/Material çizgisinde, <code>--icon-stroke: 1.75</code> ile ince. Hepsi <code>currentColor</code> ile boyanır; emoji kullanılmaz.</p>
<h2>Dock · dolu</h2><div class="g" id="g1"></div>
<h2>Arayüz · çizgi</h2><div class="g" id="g2"></div>
<script>
const SOLID=['namaz','zikir','okuma','muhasebe','kible'];
const LINE=['gear','place','back','chevron-down','chevron-right','chevron-left','close','check','plus','minus','refresh','bell','snooze','moon','sun','clock','calendar','sparkle','flame','search','more-v','menu','edit','trash','book','info','share','vibrate'];
const cell=(n,c)=>`<div class="it"><svg class="ico ico--lg ${c}"><use href="#i-${n}"/></svg><div class="nm">i-${n}</div></div>`;
g1.innerHTML=SOLID.map(n=>cell(n,'ico--solid')).join('');g2.innerHTML=LINE.map(n=>cell(n,'')).join('');
</script>
